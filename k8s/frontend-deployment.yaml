apiVersion: apps/v1
kind: Deployment
metadata:
  name: team5-frontend
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: team5-frontend
  template:
    metadata:
      labels:
        app: team5-frontend
    spec:
      imagePullSecrets:
        - name: team5-harbor-secret
      containers:
        - name: frontend
          image: amdp-registry.skala-ai.com/skala26a-ai2/team5-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
