apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team5-iveri-postgres
  namespace: skala-argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SKALA-TEAM5/db.git
    targetRevision: main
    path: k8s/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: skala3-finalproj-class2-team5
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
