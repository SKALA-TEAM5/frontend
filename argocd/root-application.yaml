apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team5-iveri
  namespace: skala-argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SKALA-TEAM5/frontend.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: skala-argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
